<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a14">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<!--A-->
<title>Gölgekuyu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Yerleşim: tek ekran. Üstte can/deneyim şeridi, ortada zindan penceresi, altta başparmak hizasında eylem çubuğu. */
:root{
  --void:#0d0a14; --stone:#1b1626; --stone-2:#2a2238; --line:#43385a;
  --bone:#ece4d0; --dim:#a79db8;
  --torch:#f2a33a; --blood:#d9484a; --moss:#62b86a; --mana:#5a9be0; --soul:#b07ae8;
  --rar0:#c3bccd; --rar1:#6aa8ea; --rar2:#b98af0; --rar3:#f5b04a;
  --display:'Pixelify Sans',ui-monospace,'Courier New',monospace;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;box-sizing:border-box}
body{background:var(--void);color:var(--bone);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges}

#app{position:relative;height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* --- üst şerit --- */
#hud{display:flex;gap:10px;align-items:stretch;font-family:var(--display)}
.bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bar{position:relative;height:22px;background:#07050c;border:2px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;width:0;transition:width .18s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;font-variant-numeric:tabular-nums}
.bar.hp i{background:linear-gradient(#ef6466,var(--blood) 55%,#a82f3a)}
.bar.xp{height:14px}.bar.xp i{background:linear-gradient(#c79bf4,var(--soul) 55%,#7c4fb8)}
.bar.xp span{font-size:11px}
.meta{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-size:14px;font-weight:600;white-space:nowrap}
.meta .gold{color:#f2c94c;display:flex;align-items:center;gap:4px}
.meta img{width:16px;height:16px}

/* --- sahne --- */
#stage{position:relative;flex:1;min-height:0;border:2px solid var(--line);background:#07050c;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#mini{position:absolute;top:6px;right:6px;width:68px;height:68px;background:rgba(7,5,12,.72);border:2px solid var(--line);pointer-events:none}
#bossBar{position:absolute;top:8px;left:8px;right:86px;font-family:var(--display);pointer-events:none}
#bossBar b{display:block;font-size:13px;color:#ffb3a8;text-shadow:0 1px 0 #000;margin-bottom:2px}
#bossBar div{height:10px;background:#07050c;border:2px solid #6d2630}
#bossBar i{display:block;height:100%;background:var(--blood);transition:width .15s}
#log{position:absolute;left:8px;bottom:8px;right:8px;display:flex;flex-direction:column;gap:2px;pointer-events:none;
  font-size:12px;line-height:1.3;color:var(--dim);text-shadow:0 1px 0 #000,0 0 4px #000}
#log div{animation:logfade 6s forwards}
@keyframes logfade{0%,70%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:6px 12px;background:rgba(7,5,12,.88);border:2px solid var(--torch);
  font-family:var(--display);font-size:14px;font-weight:600;text-align:center;max-width:86%;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none;
  font-family:var(--display);background:#07050c;opacity:0}
#banner.on{animation:banner 1.5s ease-out}
#banner b{font-size:34px;font-weight:700;color:var(--torch);letter-spacing:.06em}
#banner span{font-size:15px;color:var(--dim)}
@keyframes banner{0%{opacity:1}55%{opacity:1}100%{opacity:0}}
#descend{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:2}

/* --- eylem çubuğu --- */
#bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.act{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:4px 2px;
  background:var(--stone-2);border:2px solid var(--line);border-bottom-width:5px;font-family:var(--display);font-size:11px;font-weight:600;line-height:1.1;text-align:center}
.act:active{transform:translateY(2px);border-bottom-width:3px;margin-bottom:2px}
.act img{width:26px;height:26px}
.act .n{position:absolute;top:2px;right:4px;font-size:13px;color:var(--torch)}
.act.cd{filter:saturate(.25) brightness(.7)}
.act.cd .n{inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;text-shadow:0 2px 0 #000}
.act.on{border-color:var(--torch);background:#3a2c20}

/* --- düğmeler --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;background:var(--stone-2);
  border:2px solid var(--line);border-bottom-width:5px;font-family:var(--display);font-size:16px;font-weight:600;text-align:center}
.btn:active{transform:translateY(2px);border-bottom-width:3px;margin-bottom:2px}
.btn.pri{background:#7a3b12;border-color:var(--torch);color:#fff3dc}
.btn.soul{background:#3b2760;border-color:var(--soul)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn img{width:20px;height:20px}

/* --- paneller --- */
#overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(7,5,12,.8);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
#overlay.solid{background:var(--void);align-items:stretch}
#panel{width:100%;max-height:100%;overflow-y:auto;background:var(--stone);border:2px solid var(--line);box-shadow:0 0 0 2px #000,6px 6px 0 2px rgba(0,0,0,.55);
  padding:16px;display:flex;flex-direction:column;gap:12px}
#overlay.solid #panel{background:transparent;border:0;box-shadow:none;padding:8px 0}
#panel h1{margin:0;font-family:var(--display);font-size:clamp(40px,13vw,60px);font-weight:700;line-height:1;letter-spacing:.02em;color:var(--torch);
  text-shadow:0 4px 0 #6a2f0c,0 8px 0 #000}
#panel h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;color:var(--torch);text-wrap:balance}
#panel h3{margin:0;font-family:var(--display);font-size:16px;font-weight:600}
#panel p{margin:0;font-size:14px;line-height:1.5;color:var(--dim)}
.tag{max-width:34ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--display);font-size:14px}
.chips span{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;background:var(--stone);border:2px solid var(--line)}
.chips img{width:16px;height:16px}.chips b{color:var(--bone)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{padding:8px 2px;background:transparent;border:0;border-bottom:3px solid var(--line);font-family:var(--display);font-size:14px;font-weight:600;color:var(--dim)}
.tabs button.on{color:var(--torch);border-color:var(--torch)}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:var(--stone);border:2px solid var(--line);font-family:var(--display);font-size:14px;font-weight:600}
.cls img{width:50px;height:50px}
.cls.on{border-color:var(--torch);background:#2e2233}
.cls.lock img{filter:brightness(.25)}
.cls small{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:3px}
.cls small img{width:14px;height:14px;filter:none}
.statline{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--display);font-size:13px;color:var(--bone)}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px;background:var(--stone);border:2px solid var(--line)}
#overlay:not(.solid) .row{background:var(--stone-2)}
.row>img{width:30px;height:30px}
.row .t{min-width:0}
.row .t b{display:block;font-family:var(--display);font-size:15px}
.row .t span{display:block;font-size:12.5px;line-height:1.35;color:var(--dim)}
.row .btn{min-height:38px;padding:4px 10px;font-size:14px}
.row.done{opacity:.6}.row.got{border-color:var(--moss)}
.pips{display:flex;gap:2px;margin-top:4px}.pips i{width:8px;height:5px;background:#07050c;border:1px solid var(--line)}.pips i.f{background:var(--soul);border-color:var(--soul)}
.perk{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%;padding:12px;text-align:left;background:var(--stone-2);border:2px solid var(--line);border-bottom-width:5px}
.perk:active{transform:translateY(2px);border-bottom-width:3px;margin-bottom:2px}
.perk img{width:36px;height:36px}
.perk b{display:block;font-family:var(--display);font-size:17px;color:var(--bone)}
.perk span{display:block;font-size:13px;color:var(--dim);line-height:1.35}
.perk em{font-style:normal;color:var(--torch);font-family:var(--display);font-size:12px}
.item{padding:10px;background:var(--void);border:2px solid var(--line);display:flex;flex-direction:column;gap:3px}
.item b{font-family:var(--display);font-size:16px}
.item small{font-family:var(--display);font-size:12px;color:var(--dim)}
.item span{font-size:13px}
.item .pw{font-family:var(--display);font-size:13px;color:var(--dim)}
.r0{color:var(--rar0)}.r1{color:var(--rar1)}.r2{color:var(--rar2)}.r3{color:var(--rar3)}
.item.r1b{border-color:var(--rar1)}.item.r2b{border-color:var(--rar2)}.item.r3b{border-color:var(--rar3)}
.up{color:var(--moss)}.down{color:var(--blood)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-family:var(--display);font-size:14px}
.grid2 span{display:flex;justify-content:space-between;gap:8px;color:var(--dim)}.grid2 b{color:var(--bone);font-variant-numeric:tabular-nums}
.souls{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;border:2px solid var(--soul);background:#1e1533;font-family:var(--display);font-size:22px;font-weight:700}
.souls img{width:28px;height:28px}
.guide{display:flex;flex-direction:column;gap:10px}
.guide p b{color:var(--bone)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}#banner.on{animation-duration:.6s}}
</style>
<!--/A-->
</head>

  c.sk.forEach((id, i) => { const sk = SKILLS[id], b = $('sk' + i), cd = p.cd[i]; b.className = 'act' + (cd > 0 ? ' cd' : ''); b.innerHTML = img(sk.ic) + `<span>${sk.s}</span>` + (cd > 0 ? `<span class="n">${cd}</span>` : ''); });
  $('potBtn').innerHTML = img('potion') + `<span>İksir</span><span class="n">${p.potions}/${POT_MAX}</span>`;
  $('expBtn').className = 'act' + (auto && auto.explore ? ' on' : ''); $('expBtn').innerHTML = img('compass') + `<span>${auto && auto.explore ? 'Dur' : 'Keşfet'}</span>`;
  $('charBtn').innerHTML = img(p.cls) + '<span>Karakter</span>';
  $('descend').hidden = over || G.tiles[idx(p.x, p.y)] !== 2;
  const b = G.mobs.find(m => m.boss && m.awake); $('bossBar').hidden = !b;
  if (b) { $('bossName').textContent = MOBS[b.t].n; $('bossFill').style.width = clamp(b.hp / b.maxHp * 100, 0, 100) + '%'; }
}
function openPanel(html, kind, solid) { modal = kind; $('overlay').hidden = false; $('overlay').className = solid ? 'solid' : ''; $('panel').innerHTML = html; $('panel').scrollTop = 0; }
function closePanel() { modal = null; $('overlay').hidden = true; if (G) { hud(); pump(); } }
function pump() { if (modal || over || !G) return; if (G.loot.length) showLoot(); else if (G.p.pend > 0) showLevel(); }
function checkAch() {
  for (const a of ACH) if (!meta.ach[a.id] && a.t()) { meta.ach[a.id] = 1; meta.souls += a.r; toast(`Başarım: ${a.n} (+${a.r} ruh)`); sfx('level'); saveMeta(); }
}
function showLevel() {
  const p = G.p;
  if (!p.choices) p.choices = PERKS.filter(k => (p.perks[k.id] || 0) < k.max).sort(() => rnd() - .5).slice(0, 3).map(k => k.id);
  openPanel(`<h2>Seviye atladın!</h2><p>Bir güç seç. Sefer boyunca seninle kalır.</p><div class="stack">` +
    p.choices.map(id => { const k = PERKS.find(q => q.id === id), n = p.perks[id] || 0; return `<button class="perk" data-a="perk" data-v="${id}">${img(k.ic)}<span><b>${k.n}</b><span>${k.d}</span>${n ? `<em>Sende ${n} tane var</em>` : ''}</span></button>`; }).join('') + `</div>`, 'level');
}
function showLoot() {
  const p = G.p, it = G.loot[0], cur = p.gear[it.slot];
  openPanel(`<h2>Ganimet!</h2><div class="two">${itemCard(it, score(cur))}${cur ? itemCard(cur).replace('<small>', '<small>Kuşanılan · ') : itemCard(null)}</div>
    <div class="two"><button class="btn pri" data-a="equip">Kuşan</button><button class="btn" data-a="sell">Sat ${img('gold')} ${Math.round(sellVal(it) * S.gold / 100)}</button></div>`, 'loot');
  sfx('chest');
}
function showShop(o) {
  const p = G.p, f = G.floor;
  if (!o.stock) o.stock = { items: [genItem(f + 1, 'weapon', 1), genItem(f + 1, 'armor'), genItem(f + 1, 'ring')], pot: 3 };
  const pp = 22 + f * 5, hp = 15 + f * 6;
  openPanel(`<h2>Gezgin Tüccar</h2><div class="chips"><span>${img('gold')} <b>${p.gold}</b> altın</span></div><div class="stack">` +
    o.stock.items.map((it, i) => `<div>${itemCard(it, score(p.gear[it.slot]))}<button class="btn wide" data-a="buy" data-v="${i}" ${p.gold < it.price ? 'disabled' : ''}>Satın al ${img('gold')} ${it.price}</button></div>`).join('') +
    (o.stock.pot > 0 ? `<div class="row">${img('potion')}<div class="t"><b>Can iksiri</b><span>Canının %40’ını yeniler. En çok ${POT_MAX} tane taşırsın. Kalan: ${o.stock.pot}</span></div><button class="btn" data-a="buypot" ${p.gold < pp || p.potions >= POT_MAX ? 'disabled' : ''}>${img('gold')} ${pp}</button></div>` : '') +
    `<div class="row">${img('heart')}<div class="t"><b>Yaraları sar</b><span>Canını tamamen doldurur.</span></div><button class="btn" data-a="buyheal" ${p.gold < hp || p.hp >= S.maxHp ? 'disabled' : ''}>${img('gold')} ${hp}</button></div>
    </div><button class="btn wide" data-a="close">Yola devam</button>`, 'shop');
  modalObj = o;
}
let modalObj = null;
function showShrine(o) {
  const f = G.floor, cost = 30 + f * 10; modalObj = o;
  const T2 = { blood: ['Kan Sunağı', 'Azami canının %15’ini kalıcı olarak ver, karşılığında +%15 saldırı kazan.', 'Kanını sun'],
    gold: ['Altın Sunağı', `${cost} altın bırak, +%12 azami can kazan.`, `${cost} altın bırak`], fate: ['Kader Sunağı', 'Kaderine razı ol. Büyük bir ödül de çıkabilir, bela da.', 'Kaderini dene'] }[o.k];
  openPanel(`<h2>${T2[0]}</h2><p>${T2[1]}</p><div class="two"><button class="btn soul" data-a="shrineYes" ${o.k === 'gold' && G.p.gold < cost ? 'disabled' : ''}>${T2[2]}</button><button class="btn" data-a="close">Dokunma</button></div>`, 'shrine');
}
function shrineYes() {
  const o = modalObj, p = G.p, f = G.floor; o.used = 1; ring(p.x, p.y, 2, '#b07ae8'); sfx('skill');
  if (o.k === 'blood') { p.bon.hp -= 15; p.bon.atk += 15; recalc(); log('Kanın sunağa aktı. Bileğin güçlendi.'); }
  else if (o.k === 'gold') { p.gold -= 30 + f * 10; p.bon.hp += 12; recalc(); heal(S.maxHp * .12); log('Altınların eridi. Bedenin güçlendi.'); }
  else { const r = rnd();
    if (r < .25) { heal(S.maxHp); addPotion(p.x, p.y); log('Kader güldü: canın doldu, bir iksir buldun.'); }
    else if (r < .45) { p.pend++; log('Kader güldü: yeni bir güç kazandın.'); }
    else if (r < .65) { G.loot.push(genItem(f + 2, null, 1)); log('Kader güldü: sunakta bir hazine belirdi.'); }
    else if (r < .82) { const d = Math.round(p.hp * .3); p.hp -= d; floatT(p.x, p.y, '-' + d, '#ff6b6b', true); log('Kader sırtını döndü: canın çekildi.'); }
    else { const pool = Object.keys(MOBS).filter(k => MOBS[k].from && f >= MOBS[k].from && f <= MOBS[k].to); summon(p, pick(pool), 2, { min: 0 }); log('Kader sırtını döndü: gölgeler canlandı!'); } }
  closePanel(); fov(); hud();
}
function showChar() {
  if (!G || over || modal) return; const p = G.p, c = CLASSES[p.cls]; auto = null;
  const perks = PERKS.filter(k => p.perks[k.id]).map(k => `<span>${k.n} <b>×${p.perks[k.id]}</b></span>`).join('');
  openPanel(`<h2>${c.n} · Seviye ${p.level}</h2>
    <div class="grid2"><span>Can <b>${Math.ceil(p.hp)}/${S.maxHp}</b></span><span>Saldırı <b>${S.atk}</b></span><span>Savunma <b>${S.def}</b></span><span>Kritik <b>%${S.crit}</b></span>
    <span>Kaçınma <b>%${S.dodge}</b></span><span>Can çalma <b>%${S.ls}</b></span><span>Öldürme <b>${G.st.kills}</b></span><span>Tur <b>${G.turn}</b></span></div>
    <div class="stack">${['weapon', 'armor', 'ring'].map(s => p.gear[s] ? itemCard(p.gear[s]) : `<div class="item"><small>${SLOT[s]}</small><b class="r0">Boş</b></div>`).join('')}</div>
    ${perks ? `<h3>Güçler</h3><div class="grid2">${perks}</div>` : ''}
    <h3>Yetenekler</h3><div class="stack">${c.sk.map(id => `<div class="row">${img(SKILLS[id].ic)}<div class="t"><b>${SKILLS[id].n}</b><span>${SKILLS[id].d}. Bekleme: ${Math.max(2, SKILLS[id].cd - S.cdr)} tur.</span></div><span></span></div>`).join('')}</div>
    <button class="btn pri wide" data-a="close">Sefere dön</button>
    <div class="two"><button class="btn" data-a="sound">Ses: ${meta.sound ? 'Açık' : 'Kapalı'}</button><button class="btn" data-a="tomenu">Ana menü</button></div>`, 'char');
}
function soulsFor() { const p = G.p; return Math.floor(G.floor * 2.5 + G.st.bosses * 12 + G.st.kills * .2 + G.st.gold / 100 + p.level); }
function showDeath() {
  const p = G.p, got = soulsFor(), rec = G.floor >= meta.best && G.floor > 1;
  meta.souls += got; meta.runs++; if (G.floor > meta.best) meta.best = G.floor; saveMeta(); store.del(RUN_KEY);
  const st = G.st, fl = G.floor, lv = p.level, cls = p.cls; G = null;
  const cheap = UPS.filter(u => (meta.up[u.id] || 0) < u.max && u.cost(meta.up[u.id] || 0) <= meta.souls).length;
  openPanel(`<h2>Kuyu seni yuttu</h2><p>${CLASSES[cls].n}, ${fl}. katta düştü.${rec ? ' Bu, şimdiye dek indiğin en derin kat.' : ''}</p>
    <div class="grid2"><span>Kat <b>${fl}</b></span><span>Seviye <b>${lv}</b></span><span>Öldürme <b>${st.kills}</b></span><span>Patron <b>${st.bosses}</b></span><span>Altın <b>${st.gold}</b></span><span>Seçkin <b>${st.elite}</b></span></div>
    <div class="souls">${img('soul')} +${got} ruh</div>
    <p>${cheap ? `Ruhların ${cheap} kalıcı geliştirmeye yetiyor. Bir sonraki sefer daha güçlü başlarsın.` : `Toplam ${meta.souls} ruhun var. Biraz daha biriktir, kalıcı güçler seni bekliyor.`}</p>
    <button class="btn pri wide" data-a="retry">Tekrar in</button>
    <div class="two"><button class="btn soul" data-a="ups">Güçlen</button><button class="btn" data-a="menu">Ana menü</button></div>`, 'death');
}

/* --- ana menü --- */
function showMenu(tab) {
  if (tab) menuTab = tab; const run = store.get(RUN_KEY, null), hasRun = run && run.v === 1 && run.p;
  const tabs = [['play', 'Sefer'], ['up', 'Güçlen'], ['ach', 'Başarım'], ['how', 'Rehber']].map(([k, n]) => `<button class="${menuTab === k ? 'on' : ''}" data-a="tab" data-v="${k}">${n}</button>`).join('');
  let body = '';
  if (menuTab === 'play') {
    const c = CLASSES[selClass], own = meta.classes[selClass];
    body = `<div class="classes">${Object.keys(CLASSES).map(k => { const o = meta.classes[k]; return `<button class="cls ${k === selClass ? 'on' : ''} ${o ? '' : 'lock'}" data-a="cls" data-v="${k}">${img(k)}<span>${CLASSES[k].n}</span>${o ? '' : `<small>${img('soul')}${CLASSES[k].cost}</small>`}</button>`; }).join('')}</div>
      <p>${c.d}</p><div class="statline"><span>Can ${c.hp}</span><span>Saldırı ${c.atk}</span><span>Savunma ${c.def}</span><span>Menzil ${c.range}</span></div>
      <div class="stack">${c.sk.map(id => `<div class="row">${img(SKILLS[id].ic)}<div class="t"><b>${SKILLS[id].n}</b><span>${SKILLS[id].d}</span></div><span></span></div>`).join('')}</div>
      <div class="stack">${!own ? `<button class="btn soul wide" data-a="unlock" ${meta.souls < c.cost ? 'disabled' : ''}>Kilidi aç ${img('soul')} ${c.cost}</button>` :
        (hasRun ? `<button class="btn pri wide" data-a="continue">Devam et · Kat ${run.floor} · ${CLASSES[run.p.cls].n}</button><button class="btn wide" data-a="start">${confirmNew ? 'Emin misin? Kayıtlı sefer silinir' : 'Yeni sefer'}</button>` : `<button class="btn pri wide" data-a="start">Kuyuya in</button>`)}</div>`;
  } else if (menuTab === 'up') {
    body = `<p>Ruhlar ölünce kazanılır ve kalıcıdır. Her geliştirme sonraki bütün seferlerde geçerli olur.</p><div class="stack">` + UPS.map(u => { const l = meta.up[u.id] || 0, full = l >= u.max, cost = u.cost(l);
      return `<div class="row ${full ? 'done' : ''}">${img(u.ic)}<div class="t"><b>${u.n}</b><span>${u.d}</span><div class="pips">${Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'f' : ''}"></i>`).join('')}</div></div>${full ? '<span class="r1">Tam</span>' : `<button class="btn soul" data-a="buyup" data-v="${u.id}" ${meta.souls < cost ? 'disabled' : ''}>${img('soul')} ${cost}</button>`}</div>`; }).join('') + `</div>`;
  } else if (menuTab === 'ach') {
    body = `<div class="stack">` + ACH.map(a => `<div class="row ${meta.ach[a.id] ? 'got' : ''}">${img(meta.ach[a.id] ? 'star' : 'skull')}<div class="t"><b>${a.n}</b><span>${a.d}</span></div><span class="${meta.ach[a.id] ? 'up' : ''}">${meta.ach[a.id] ? 'Tamam' : '+' + a.r + ' ruh'}</span></div>`).join('') + `</div>`;
  } else {
    body = `<div class="guide"><p><b>Yürü ve saldır.</b> Zemine dokun, kahraman oraya yürür. Düşmana dokun, saldırır. Klavyede ok tuşları ya da WASD.</p>
      <p><b>Keşfet düğmesi</b> seni katta otomatik gezdirir, ganimeti toplar. Bir düşman görünce durur, karar sana kalır.</p>
      <p><b>Sıra tabanlıdır.</b> Sen kıpırdamadıkça kimse kıpırdamaz. Dar koridorda dövüşürsen düşmanlar tek tek gelir.</p>
      <p><b>Her seviyede bir güç seçersin.</b> Aynı gücü üst üste almak onu katlar. Sandıklar ve seçkin düşmanlar eşya düşürür.</p>
      <p><b>Her 5 katta bir patron bekler.</b> Öncesinde iksir biriktir. Merdiven patron ölünce açılır.</p>
      <p><b>Ölüm son değil.</b> Düştüğünde ruh kazanırsın. Ruhlarla kalıcı güçler ve yeni sınıflar açılır.</p>
      <p>Kısayollar: 1 ve 2 yetenek, Q iksir, E keşfet, F en yakın düşmana saldır, boşluk bekle, Enter merdivenden in.</p></div>`;
  }
  openPanel(`<div><h1>Gölgekuyu</h1></div><p class="tag">Her iniş bir öncekinden derine gider. Her ölüm seni biraz daha güçlendirir.</p>
    <div class="chips"><span>En derin <b>${meta.best ? 'Kat ' + meta.best : 'yok'}</b></span><span>${img('soul')} <b>${meta.souls}</b> ruh</span><span>Sefer <b>${meta.runs}</b></span></div>
    <nav class="tabs">${tabs}</nav>${body}`, 'menu', true);
}
function newRun(cls) {
  over = false; meta.last = cls; saveMeta();
  G = { v: 1, floor: 1, turn: 0, nid: 1, W: 34, H: 34, tiles: [], seen: [], objs: {}, mobs: [], hazards: [], stairs: null, loot: [],
    p: { cls, x: 0, y: 0, rx: 0, ry: 0, bx: 0, by: 0, fl: 0, face: 1, hp: 1, level: 1, xp: 0, gold: 0, potions: 1 + (meta.up.pot || 0), perks: {}, gear: { weapon: null, armor: null, ring: null },
      cd: [0, 0], roar: 0, poison: 0, pend: 0, choices: null, revive: meta.up.revive ? 1 : 0, bon: { hp: 0, atk: 0 } },
    st: { kills: 0, bosses: 0, gold: 0, elite: 0 } };
  recalc(); G.p.hp = S.maxHp; genFloor(); closePanel(); resize(); enterFloor(true);
  if (!meta.tip) { meta.tip = true; saveMeta(); setTimeout(() => toast('Zemine dokun: yürü. Düşmana dokun: saldır.'), 1600); }
}
function loadRun() {
  const r = store.get(RUN_KEY, null); if (!r || r.v !== 1 || !r.p || !r.tiles || !r.tiles.length) return false;
  G = r; over = false; vis = new Uint8Array(G.W * G.H); G.mobs.forEach(m => { m.rx = m.x; m.ry = m.y; }); recalc(); closePanel(); resize(); enterFloor(false); pump(); return true;
}
function saveRun() { if (G && !over) store.set(RUN_KEY, G); }

/* ================= GİRDİ ================= */
const ACT = {
  tab: v => { confirmNew = false; showMenu(v); }, cls: v => { selClass = v; confirmNew = false; showMenu(); },
  unlock: () => { const c = CLASSES[selClass]; if (meta.souls >= c.cost) { meta.souls -= c.cost; meta.classes[selClass] = true; saveMeta(); sfx('level'); checkAch(); showMenu(); } },
  start: () => { if (store.get(RUN_KEY, null) && !confirmNew) { confirmNew = true; showMenu(); return; } confirmNew = false; store.del(RUN_KEY); newRun(selClass); },
  continue: () => { if (!loadRun()) { store.del(RUN_KEY); showMenu(); } },
  buyup: v => { const u = UPS.find(q => q.id === v), l = meta.up[v] || 0, c = u.cost(l); if (l < u.max && meta.souls >= c) { meta.souls -= c; meta.up[v] = l + 1; saveMeta(); sfx('coin'); const sc = $('panel').scrollTop; showMenu(); $('panel').scrollTop = sc; } },
  perk: v => { const p = G.p; p.perks[v] = (p.perks[v] || 0) + 1; p.pend--; p.choices = null; const b = S.maxHp; recalc(); if (v === 'vit') heal(S.maxHp - b, true); if (v === 'alch') addPotion(p.x, p.y); saveRun(); closePanel(); },
  equip: () => { const it = G.loot.shift(); equip(it); log(it.name + ' kuşanıldı.'); saveRun(); closePanel(); },
  sell: () => { const it = G.loot.shift(); gainGold(sellVal(it), G.p.x, G.p.y); saveRun(); closePanel(); },
  buy: v => { const p = G.p, it = modalObj.stock.items[+v]; if (p.gold < it.price) return; p.gold -= it.price; modalObj.stock.items.splice(+v, 1); equip(it); sfx('coin'); showShop(modalObj); },
  buypot: () => { const p = G.p, c = 22 + G.floor * 5; if (p.gold < c || p.potions >= POT_MAX) return; p.gold -= c; p.potions++; modalObj.stock.pot--; sfx('potion'); showShop(modalObj); },
  buyheal: () => { const p = G.p, c = 15 + G.floor * 6; if (p.gold < c) return; p.gold -= c; p.hp = S.maxHp; p.poison = 0; sfx('potion'); showShop(modalObj); },
  shrineYes, close: () => closePanel(),
  sound: () => { meta.sound = !meta.sound; saveMeta(); modal = null; showChar(); },
  tomenu: () => { saveRun(); G = null; showMenu('play'); },
  retry: () => newRun(meta.last), ups: () => showMenu('up'), menu: () => showMenu('play')
};
$('panel').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; sfx('click'); ACT[b.dataset.a](b.dataset.v); });
cv.addEventListener('pointerdown', e => {
  if (busy()) return; const r = cv.getBoundingClientRect(), p = G.p, sc = cw / r.width;
  const wx = ((e.clientX - r.left) * sc - cw / 2) / T + p.rx + .5, wy = ((e.clientY - r.top) * sc - ch / 2) / T + p.ry + .5;
  handleTap(Math.floor(wx), Math.floor(wy)); e.preventDefault();
});
$('sk0').onclick = () => useSkill(0); $('sk1').onclick = () => useSkill(1); $('potBtn').onclick = usePotion; $('expBtn').onclick = toggleExplore; $('charBtn').onclick = showChar; $('descend').onclick = descend;
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return; const k = e.key.toLowerCase();
  if (modal) { if (k === 'escape' && (modal === 'char' || modal === 'shop' || modal === 'shrine')) closePanel(); return; }
  if (busy()) return;
  const mv = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
  if (mv) { auto = null; tryMove(mv[0], mv[1]); e.preventDefault(); }
  else if (k === ' ') { wait(); e.preventDefault(); }
  else if (k === '1') useSkill(0); else if (k === '2') useSkill(1); else if (k === 'q') usePotion(); else if (k === 'e') toggleExplore();
  else if (k === 'f') { const m = nearest(); if (m && (man(m, G.p) === 1 || canShoot(m))) { playerAttack(m, man(m, G.p) > 1); endTurn(); } }
  else if (k === 'enter') { descend(); e.preventDefault(); } else if (k === 'c' || k === 'escape') showChar();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveRun(); saveMeta(); } });
window.addEventListener('pagehide', () => { saveRun(); saveMeta(); });
if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage')); window.addEventListener('resize', resize);

/* ================= BAŞLAT ================= */
function start(data) {
  $('goldIco').src = ico('gold'); resize();
  if (!(data && data.resume && loadRun())) showMenu('play');
  requestAnimationFrame(frame);
}
window.__gk = { get G() { return G; }, get S() { return S; }, get modal() { return modal; }, get over() { return over; }, meta, SPR, newRun, handleTap, exploreStep, useSkill, usePotion, descend, tryMove, visMobs, nearest, canShoot, playerAttack, endTurn, ACT };
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => { saveRun(); saveMeta(); return { resume: !!G }; }); } catch (e) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
