<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a14">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<!--A-->
<title>Gölgekuyu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Yerleşim: tek ekran. Üstte can/deneyim şeridi, ortada zindan penceresi, altta başparmak hizasında eylem çubuğu. */
:root{
  --void:#0d0a14; --stone:#1b1626; --stone-2:#2a2238; --line:#43385a;
  --bone:#ece4d0; --dim:#a79db8;
  --torch:#f2a33a; --blood:#d9484a; --moss:#62b86a; --mana:#5a9be0; --soul:#b07ae8;
  --rar0:#c3bccd; --rar1:#6aa8ea; --rar2:#b98af0; --rar3:#f5b04a;
  --display:'Pixelify Sans',ui-monospace,'Courier New',monospace;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;box-sizing:border-box}
body{background:var(--void);color:var(--bone);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges}

#app{position:relative;height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* --- üst şerit --- */
#hud{display:flex;gap:10px;align-items:stretch;font-family:var(--display)}
.bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bar{position:relative;height:22px;background:#07050c;border:2px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;width:0;transition:width .18s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;font-variant-numeric:tabular-nums}
.bar.hp i{background:linear-gradient(#ef6466,var(--blood) 55%,#a82f3a)}
.bar.xp{height:14px}.bar.xp i{background:linear-gradient(#c79bf4,var(--soul) 55%,#7c4fb8)}
.bar.xp span{font-size:11px}
.meta{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-size:14px;font-weight:600;white-space:nowrap}
.meta .gold{color:#f2c94c;display:flex;align-items:center;gap:4px}
.meta img{width:16px;height:16px}

/* --- sahne --- */
#stage{position:relative;flex:1;min-height:0;border:2px solid var(--line);background:#07050c;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#mini{position:absolute;top:6px;right:6px;width:68px;height:68px;background:rgba(7,5,12,.72);border:2px solid var(--line);pointer-events:none}
#bossBar{position:absolute;top:8px;left:8px;right:86px;font-family:var(--display);pointer-events:none}
#tgt{position:absolute;top:8px;left:8px;width:46%;max-width:190px;font-family:var(--display);pointer-events:none}
#tgt.low{top:46px}
#tgt b{display:block;font-size:12px;color:var(--bone);text-shadow:0 1px 0 #000,0 0 4px #000;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tgt div{height:8px;background:#07050c;border:2px solid var(--line)}
#tgt i{display:block;height:100%;background:var(--blood);transition:width .12s}
#tgt.el i{background:#f2c94c}
#bossBar b{display:block;font-size:13px;color:#ffb3a8;text-shadow:0 1px 0 #000;margin-bottom:2px}
#bossBar div{height:10px;background:#07050c;border:2px solid #6d2630}
#bossBar i{display:block;height:100%;background:var(--blood);transition:width .15s}
#log{position:absolute;left:8px;bottom:8px;right:8px;display:flex;flex-direction:column;gap:2px;pointer-events:none;
  font-size:12px;line-height:1.3;color:var(--dim);text-shadow:0 1px 0 #000,0 0 4px #000}
#log div{animation:logfade 6s forwards}
@keyframes logfade{0%,70%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:6px 12px;background:rgba(7,5,12,.88);border:2px solid var(--torch);
  font-family:var(--display);font-size:14px;font-weight:600;text-align:center;max-width:86%;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none;
  font-family:var(--display);background:#07050c;opacity:0}
#banner.on{animation:banner 1.5s ease-out}
#banner b{font-size:34px;font-weight:700;color:var(--torch);letter-spacing:.06em}
#banner span{font-size:15px;color:var(--dim)}
@keyframes banner{0%{opacity:1}55%{opacity:1}100%{opacity:0}}
#descend{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:2}

/* --- eylem çubuğu --- */
#bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.act{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:4px 2px;
  background:var(--stone-2);border:2px solid var(--line);border-bottom-width:5px;font-family:var(--display);font-size:11px;font-weight:600;line-height:1.1;text-align:center}
.act:active{transform:translateY(2px);border-bottom-width:3px;margin-bottom:2px}
.act img{width:26px;height:26px}
.act .n{position:absolute;top:2px;right:4px;font-size:13px;color:var(--torch)}
.act.cd{filter:saturate(.25) brightness(.7)}
.act.cd .n{inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;text-shadow:0 2px 0 #000}
.act.on{border-color:var(--torch);background:#3a2c20}
.act.rdy{border-color:var(--torch)}
.act.warn{border-color:var(--blood);animation:warn .7s steps(2) infinite}
@keyframes warn{50%{background:#4a1f26}}

/* --- düğmeler --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;background:var(--stone-2);
  border:2px solid var(--line);border-bottom-width:5px;font-family:var(--display);font-size:16px;font-weight:600;text-align:center}
.btn:active{transform:translateY(2px);border-bottom-width:3px;margin-bottom:2px}
.btn.pri{background:#7a3b12;border-color:var(--torch);color:#fff3dc}
.btn.soul{background:#3b2760;border-color:var(--soul)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn img{width:20px;height:20px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn.opt{flex-direction:column;gap:0;padding:4px 2px;font-size:13px;min-width:0}
.btn.opt b{color:var(--torch);font-weight:600}

/* --- paneller --- */
#overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(7,5,12,.8);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
#overlay.solid{background:var(--void);align-items:stretch}
#panel{width:100%;max-height:100%;overflow-y:auto;background:var(--stone);border:2px solid var(--line);box-shadow:0 0 0 2px #000,6px 6px 0 2px rgba(0,0,0,.55);
  padding:16px;display:flex;flex-direction:column;gap:12px}
#overlay.solid #panel{background:transparent;border:0;box-shadow:none;padding:8px 0}
#panel h1{margin:0;font-family:var(--display);font-size:clamp(40px,13vw,60px);font-weight:700;line-height:1;letter-spacing:.02em;color:var(--torch);
  text-shadow:0 4px 0 #6a2f0c,0 8px 0 #000}
#panel h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;color:var(--torch);text-wrap:balance}
#panel h3{margin:0;font-family:var(--display);font-size:16px;font-weight:600}
#panel p{margin:0;font-size:14px;line-height:1.5;color:var(--dim)}
.tag{max-width:34ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--display);font-size:14px}
.chips span{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;background:var(--stone);border:2px solid var(--line)}
.chips img{width:16px;height:16px}.chips b{color:var(--bone)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{padding:8px 2px;background:transparent;border:0;border-bottom:3px solid var(--line);font-family:var(--display);font-size:14px;font-weight:600;color:var(--dim)}
.tabs button.on{color:var(--torch);border-color:var(--torch)}
.classes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cls{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;min-width:0;background:var(--stone);border:2px solid var(--line);font-family:var(--display);font-size:13px;font-weight:600}
.cls img{width:44px;height:44px}
.cls.on{border-color:var(--torch);background:#2e2233}
.cls.lock img{filter:brightness(.25)}
.cls small{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:3px}
.cls small img{width:14px;height:14px;filter:none}
.statline{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--display);font-size:13px;color:var(--bone)}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px;background:var(--stone);border:2px solid var(--line)}
#overlay:not(.solid) .row{background:var(--stone-2)}
.row>img{width:30px;height:30px}
.row .t{min-width:0}
.row .t b{display:block;font-family:var(--display);font-size:15px}
.row .t span{display:block;font-size:12.5px;line-height:1.35;color:var(--dim)}
.row .btn{min-height:38px;padding:4px 10px;font-size:14px}
.row.done{opacity:.6}.row.got{border-color:var(--moss)}
.pips{display:flex;gap:2px;margin-top:4px}.pips i{width:8px;height:5px;background:#07050c;border:1px solid var(--line)}.pips i.f{background:var(--soul);border-color:var(--soul)}
.perk{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%;padding:12px;text-align:left;background:var(--stone-2);border:2px solid var(--line);border-bottom-width:5px}
.perk:active{transform:translateY(2px);border-bottom-width:3px;margin-bottom:2px}
.perk img{width:36px;height:36px}
.perk b{display:block;font-family:var(--display);font-size:17px;color:var(--bone)}
.perk span{display:block;font-size:13px;color:var(--dim);line-height:1.35}
.perk em{font-style:normal;color:var(--torch);font-family:var(--display);font-size:12px}
.item{padding:10px;background:var(--void);border:2px solid var(--line);display:flex;flex-direction:column;gap:3px}
.item b{font-family:var(--display);font-size:16px}
.item small{font-family:var(--display);font-size:12px;color:var(--dim)}
.item span{font-size:13px}
.item .pw{font-family:var(--display);font-size:13px;color:var(--dim)}
.r0{color:var(--rar0)}.r1{color:var(--rar1)}.r2{color:var(--rar2)}.r3{color:var(--rar3)}
.item.r1b{border-color:var(--rar1)}.item.r2b{border-color:var(--rar2)}.item.r3b{border-color:var(--rar3)}
.up{color:var(--moss)}.down{color:var(--blood)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-family:var(--display);font-size:14px}
.grid2 span{display:flex;justify-content:space-between;gap:8px;color:var(--dim)}.grid2 b{color:var(--bone);font-variant-numeric:tabular-nums}
.souls{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;border:2px solid var(--soul);background:#1e1533;font-family:var(--display);font-size:22px;font-weight:700}
.souls img{width:28px;height:28px}
.guide{display:flex;flex-direction:column;gap:10px}
.guide p b{color:var(--bone)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.act.warn{animation:none}#banner.on{animation-duration:.6s}}
</style>
<!--/A-->
</head>

function newRun(cls) {

  perk: v => { const p = G.p; p.perks[v] = (p.perks[v] || 0) + 1; p.pend--; p.choices = null; const b = S.maxHp; recalc(); if (v === 'vit') heal(S.maxHp - b, true); if (v === 'alch') addPotion(p.x, p.y); saveRun(); closePanel(); },

  buy: v => { const p = G.p, it = modalObj.stock.items[+v], c = cost(it.price); if (p.gold < c) return; p.gold -= c; modalObj.stock.items.splice(+v, 1); equip(it); sfx('coin'); showShop(modalObj); },
  buypot: () => { const p = G.p, c = cost(22 + G.floor * 5); if (p.gold < c || p.potions >= potMax()) return; p.gold -= c; p.potions++; modalObj.stock.pot--; sfx('potion'); showShop(modalObj); },
  buyheal: () => { const p = G.p, c = cost(15 + G.floor * 6); if (p.gold < c) return; p.gold -= c; p.hp = S.maxHp; p.poison = 0; sfx('potion'); showShop(modalObj); },
  shrineYes, close: () => closePanel(),

};
$('panel').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; sfx('click'); ACT[b.dataset.a](b.dataset.v); });
/* Dokunma: tek dokunuş = git / saldır. Düşmana basılı tut = saldırmayı sürdür. Sürükle = o yöne adım adım yürü (parmak basılıyken devam eder). */
let ptr = null;
const tileAt = e => { const r = cv.getBoundingClientRect(), p = G.p, sc = cw / r.width;
  return [Math.floor(((e.clientX - r.left) * sc - cw / 2) / T + p.rx + .5), Math.floor(((e.clientY - r.top) * sc - ch / 2) / T + p.ry + .5)]; };
const ptrEnd = () => { if (ptr) { clearTimeout(ptr.hold); clearInterval(ptr.rep); ptr = null; } };
const stepDir = d => { if (busy()) return; auto = null; tryMove(d[0], d[1]); };
cv.addEventListener('pointerdown', e => {
  if (busy()) return; e.preventDefault(); ptrEnd(); try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  const [tx, ty] = tileAt(e), me = ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, tx, ty, swipe: false, held: false, dir: null };
  me.hold = setTimeout(() => {

cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id || ptr.held) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.hypot(dx, dy) < 24) { if (ptr.dir) { clearInterval(ptr.rep); ptr.dir = null; } return; }
  const d = ax > ay ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  if (ptr.dir && ((d[0] === ptr.dir[0] && d[1] === ptr.dir[1]) || Math.max(ax, ay) < Math.min(ax, ay) * 1.35)) return;

$('sk0').onclick = () => useSkill(0); $('sk1').onclick = () => useSkill(1); $('potBtn').onclick = usePotion; $('expBtn').onclick = toggleExplore; $('charBtn').onclick = showChar; $('descend').onclick = descend;

/* Android paketi (Capacitor): geri tuşu açık pencereyi kapatır, seferde karakter ekranını açar, ana menüde uygulamayı arka plana alır. */
(() => {
  const cap = window.Capacitor; if (!cap || !cap.registerPlugin || !cap.isNativePlatform || !cap.isNativePlatform()) return;

/* ================= ÖDÜLLÜ REKLAM =================
   Yalnızca Android paketinde çalışır (android-app/). Web sürümünde reklam yoktur, düğmeler görünmez.
   Ödül, reklam sonuna kadar izlenip kapatıldığında verilir. */
const ads = {
  ok: false, loaded: false, loading: false, busy: false, earned: false, cb: null, plugin: null, cfg: null,
  init() {
    const cap = window.Capacitor, cfg = this.cfg = window.GK_ADS;
    if (!cfg || !cfg.rewardedAdUnitId || !cap || !cap.registerPlugin || !cap.isNativePlatform || !cap.isNativePlatform()) return;
    try {
      const A = this.plugin = cap.registerPlugin('AdMob');
      A.addListener('onRewardedVideoAdReward', () => { this.earned = true; });
      A.addListener('onRewardedVideoAdDismissed', () => this.finish());
      A.addListener('onRewardedVideoAdFailedToShow', () => this.finish());
      A.initialize({ initializeForTesting: !!cfg.testing })
        .then(() => A.requestConsentInfo().then(i => (i && i.isConsentFormAvailable && i.status === 'REQUIRED' ? A.showConsentForm() : null)).catch(() => null))
        .then(() => { this.ok = true; this.load(); }).catch(() => {});
    } catch (e) {}
  },
  load() {
    if (!this.ok || this.loaded || this.loading) return; this.loading = true;
    this.plugin.prepareRewardVideoAd({ adId: this.cfg.rewardedAdUnitId, isTesting: !!this.cfg.testing })
      .then(() => { this.loaded = true; this.loading = false; })
      .catch(() => { this.loading = false; setTimeout(() => this.load(), 30000); });
  },
  show(onReward) {
    if (this.busy) return;
    if (!this.loaded) { toast('Reklam henüz hazır değil. Biraz sonra tekrar dene.'); this.load(); return; }
    this.busy = true; this.earned = false; this.loaded = false; this.cb = onReward; if (ac) ac.suspend();
    this.plugin.showRewardVideoAd().catch(() => this.finish());
  },
  finish() {
    if (!this.busy) return; this.busy = false; const cb = this.cb; this.cb = null; if (ac && !document.hidden) ac.resume();
    if (this.earned && cb) cb(); else toast('Reklam tamamlanmadı, ödül verilmedi.');
    this.load();
  }
};
